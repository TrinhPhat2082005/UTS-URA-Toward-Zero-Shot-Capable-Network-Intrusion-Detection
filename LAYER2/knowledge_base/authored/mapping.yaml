# 14 nhan cua CSE-CIC-IDS2018 -> cau hanh vi, technique ATT&CK, CAPEC.
#
# Day la file DUY NHAT cua KB co QUYET DINH cua tac gia. Khong co mapping chinh thuc nao tu nhan dataset
# sang ATT&CK (MITRE khong map dataset); moi lua chon la phan doan cua tac gia, kem bang chung:
#   scenario   trich nguyen van trang dataset (UNB/CIC)
#   behaviour  cau tac gia viet, chi noi dieu `support` noi (trich dan + so lieu)
#   technique  quyet dinh + trich dan mo ta technique trong ATT&CK v20.1 + ly do
#   capec      route "taxonomy_mapping": CAPEC v3.9 tu lien ket muc nay toi technique (part_mechanism.py
#              kiem tu dong); route "description": CAPEC khong lien ket, chon theo mo ta (co trich dan)
# Mapping cu (knowledge_base/attack_profiles/*.json, theo Borisenko et al. 2022) duoc build_report.md
# dat canh moi dong de so sanh; cac nhan doi technique co rationale noi ro vi sao.
# Ten tool chi nam trong `scenario` (trich dan dataset), KHONG nam trong cau hanh vi gui cho VLM.

SSH_Bruteforce:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'SSH-Bruteforce'}
  scenario:
    - {src: unb-ids2018, locator: "1. Introduction, Brute force attacks",
       quote: 'The final scenario has been designed with the goal of acquiring an SSH and MySQL account by running a dictionary brute force attack against the main server.'}
    - {src: unb-ids2018, locator: "2.2.1 Brute-force attack",
       quote: 'In this dataset we use two modules, FTP and SSH on the Kali Linux machine as the attacker machine and an Ubuntu 14.0 system as the victim machine.'}
    - {src: unb-ids2018, locator: "2.2.1 Brute-force attack", quote: 'For a list of passwords, we use a large dictionary that contains 90 million words.'}
  behaviour:
    text: "Dictionary password guessing against the SSH service of the victim server."
    support:
      - {src: unb-ids2018, locator: "1. Introduction, Brute force attacks", quote: 'by running a dictionary brute force attack against the main server.'}
      - {data: claims.ssh_port22_ge999}
  technique:
    decision: T1110.001
    support:
      - {src: attack-20.1, locator: "T1110.001 description",
         quote: 'Without knowledge of the password for an account, an adversary may opt to systematically guess the password using a repetitive or iterative mechanism.'}
    rationale: "The scenario guesses account passwords from a dictionary; Password Guessing is the ATT&CK sub-technique for guessing passwords from a list. Same as the previous mapping."
  # checklist 6.3: CAPEC-49 ("tries every possible value") trai voi kich ban dung tu dien; CAPEC-16 la con
  # truc tiep cua CAPEC-49, ma CAPEC-49 lien ket toi T1110.001 (route child_of_linked, part_mechanism.py kiem)
  capec:
    decision: CAPEC-16
    route: child_of_linked
    support:
      - {src: capec-3.9, locator: "CAPEC-16 Description", quote: 'This is a specific instance of the password brute forcing attack pattern.'}
      - {src: unb-ids2018, locator: "2.2.1 Brute-force attack", quote: 'For a list of passwords, we use a large dictionary that contains 90 million words.'}
    rationale: "The dataset page says the passwords come from a dictionary; CAPEC-16 Dictionary-based Password Attack describes that case and is a child of CAPEC-49, the entry CAPEC links to T1110.001. CHANGED from CAPEC-49, whose description (trying every possible value) does not match a dictionary attack."

FTP_BruteForce:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'FTP-BruteForce'}
  scenario:
    - {src: unb-ids2018, locator: "2.2.1 Brute-force attack",
       quote: 'In this dataset we use two modules, FTP and SSH on the Kali Linux machine as the attacker machine and an Ubuntu 14.0 system as the victim machine.'}
    - {src: unb-ids2018, locator: "2.2.1 Brute-force attack", quote: 'For a list of passwords, we use a large dictionary that contains 90 million words.'}
  # checklist 1.2d: the cu chi noi kich ban; du lieu cho thay moi flow toi TCP 21 va khong co payload
  # (claim bat bien), va phan tich doc lap cua DistriNet cho biet cong 21 dong nen khong thu duoc mat khau.
  behaviour:
    text: "The dataset page describes a dictionary password attack against the FTP service of the victim server. In the published CSV files every flow with this label goes to TCP port 21 and carries no payload in either direction. An independent analysis of the original capture reports that the target answered the connection attempts only with reset packets, so port 21 was closed and no credentials could be tried."
    support:
      - {src: unb-ids2018, locator: "2.2.1 Brute-force attack", quote: 'For a list of passwords, we use a large dictionary that contains 90 million words.'}
      - {data: claims.twin_tcp21_nopayload__FTP_BruteForce}
      - {src: distrinet-2018, locator: "1. FTP Patator, 14-02-2018",
         quote: 'In response to the SYN packets being sent out, only [RST, ACK] packets are sent in response, suggesting that port 21 is closed, and so the attacker has no opportunity to actually "brute force" with credentials.'}
  technique:
    decision: T1110.001
    support:
      - {src: attack-20.1, locator: "T1110.001 description",
         quote: 'Without knowledge of the password for an account, an adversary may opt to systematically guess the password using a repetitive or iterative mechanism.'}
    rationale: "Same scenario as SSH_Bruteforce on the FTP service; the label keeps the technique named by the scenario, while the label card states that the data show a failed attempt. Same as the previous mapping."
  capec:
    decision: CAPEC-16
    route: child_of_linked
    support:
      - {src: capec-3.9, locator: "CAPEC-16 Description", quote: 'This is a specific instance of the password brute forcing attack pattern.'}
      - {src: unb-ids2018, locator: "2.2.1 Brute-force attack", quote: 'For a list of passwords, we use a large dictionary that contains 90 million words.'}
    rationale: "Same choice as SSH_Bruteforce: the scenario uses a dictionary. CHANGED from CAPEC-49."

DoS_attacks_GoldenEye:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DoS-GoldenEye'}
  scenario:
    - {src: unb-ids2018, locator: "Table 1", quote: 'DoS attack Hulk, GoldenEye, Slowloris, Slowhttptest One day Kali linux Ubuntu 16.4 (Apache)'}
  behaviour:
    text: "Denial-of-service attack on the victim's Apache web server."
    support:
      - {src: unb-ids2018, locator: "Table 1", quote: 'DoS attack Hulk, GoldenEye, Slowloris, Slowhttptest One day Kali linux Ubuntu 16.4 (Apache)'}
      - {data: claims.port80_all__DoS_attacks_GoldenEye}
  technique:
    decision: T1499.002
    support:
      - {src: attack-20.1, locator: "T1499.002 description",
         quote: 'Adversaries may target the different network services provided by systems to conduct a denial of service (DoS). Adversaries often target the availability of DNS and web services; however, others have been targeted as well.'}
      - {data: claims.port80_all__DoS_attacks_GoldenEye}
    rationale: "Denial of service against a web service (UNB: DoS attack on Apache; every flow of the label goes to port 80). Same as the previous mapping."
  capec:
    decision: CAPEC-488
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-488 Description", quote: 'An adversary may execute a flooding attack using the HTTP protocol with the intent to deny legitimate users access to a service by consuming resources at the application layer such as web services and their infrastructure.'}]
    rationale: "Of the CAPEC entries linked to T1499.002 (469, 482, 488, 489, 528), HTTP Flood matches a DoS on a web server reached on port 80; the dataset page does not describe a slow-request attack for this tool."

DoS_attacks_Hulk:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DoS-Hulk'}
  scenario:
    - {src: unb-ids2018, locator: "Table 1", quote: 'DoS attack Hulk, GoldenEye, Slowloris, Slowhttptest One day Kali linux Ubuntu 16.4 (Apache)'}
  behaviour:
    text: "Denial-of-service attack on the victim's Apache web server."
    support:
      - {src: unb-ids2018, locator: "Table 1", quote: 'DoS attack Hulk, GoldenEye, Slowloris, Slowhttptest One day Kali linux Ubuntu 16.4 (Apache)'}
      - {data: claims.port80_all__DoS_attacks_Hulk}
  technique:
    decision: T1499.002
    support:
      - {src: attack-20.1, locator: "T1499.002 description",
         quote: 'Adversaries may target the different network services provided by systems to conduct a denial of service (DoS). Adversaries often target the availability of DNS and web services; however, others have been targeted as well.'}
      - {data: claims.port80_all__DoS_attacks_Hulk}
    rationale: "Denial of service against a web service (UNB: DoS attack on Apache; every flow of the label goes to port 80). Same as the previous mapping."
  capec:
    decision: CAPEC-488
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-488 Description", quote: 'An adversary may execute a flooding attack using the HTTP protocol with the intent to deny legitimate users access to a service by consuming resources at the application layer such as web services and their infrastructure.'}]
    rationale: "Same choice as DoS_attacks_GoldenEye."

DoS_attacks_SlowHTTPTest:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DoS-SlowHTTPTest'}
  scenario:
    - {src: unb-ids2018, locator: "Table 1", quote: 'DoS attack Hulk, GoldenEye, Slowloris, Slowhttptest One day Kali linux Ubuntu 16.4 (Apache)'}
  # checklist 1.2d: the cu ("DoS on Apache") trai du lieu; nay noi ca kich ban, du lieu (bat bien) va audit
  behaviour:
    text: "The dataset page lists Slowhttptest among the denial-of-service tools run against an Apache web server. In the published CSV files every flow with this label goes to TCP port 21 (FTP) and carries no payload in either direction. An independent analysis of the original capture found no successful Slowhttptest attack and reports that the tool appears to have been launched against port 21 by mistake."
    support:
      - {src: unb-ids2018, locator: "Table 1", quote: 'DoS attack Hulk, GoldenEye, Slowloris, Slowhttptest One day Kali linux Ubuntu 16.4 (Apache)'}
      - {data: claims.twin_tcp21_nopayload__DoS_attacks_SlowHTTPTest}
      - {src: distrinet-2018, locator: "6. DoS Slowhttptest, 16-02-2018",
         quote: 'No succesful DoS Slowhttptest attack was found in this dataset. Instead, it looks like the tool was mistakenly launched against port 21.'}
  technique:
    decision: T1499.002
    support:
      - {src: attack-20.1, locator: "T1499.002 description",
         quote: 'Adversaries may target the different network services provided by systems to conduct a denial of service (DoS). Adversaries often target the availability of DNS and web services; however, others have been targeted as well.'}
    rationale: "Denial of service against a web service per the dataset page; the label keeps the technique named by the scenario, while the label card states that the data show a failed attempt on port 21. Same as the previous mapping."
  capec:
    decision: CAPEC-469
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-469 Description", quote: 'The idea is to keep the HTTP session alive indefinitely and then repeat that hundreds of times.'}]
    rationale: "Of the CAPEC entries linked to T1499.002, HTTP DoS describes holding HTTP sessions open, which is what a slow-HTTP test tool does; the dataset page gives only the tool name."

DoS_attacks_Slowloris:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DoS-Slowloris'}
  scenario:
    - {src: unb-ids2018, locator: "1. Introduction, HTTP denial of service",
       quote: 'Slowloris starts by making a full TCP connection to the remote server. The tool holds the connection open by sending valid, incomplete HTTP requests to the server at regular intervals to keep the sockets from closing.'}
    - {src: unb-ids2018, locator: "2.2.4 Denial-of-Service", quote: 'In this scenario, we use a Slowloris Perl-based tool to take down the web server.'}
  behaviour:
    text: "Slow HTTP denial of service: connections to the victim web server are held open by sending valid but incomplete HTTP requests at regular intervals, until the server has no free connections."
    support:
      - {src: unb-ids2018, locator: "1. Introduction, HTTP denial of service",
         quote: 'The tool holds the connection open by sending valid, incomplete HTTP requests to the server at regular intervals to keep the sockets from closing. Since any Web server has a finite ability to serve connections, it will only be a matter of time before all sockets are used up and no other connection can be made.'}
      - {data: claims.port80_all__DoS_attacks_Slowloris}
  technique:
    decision: T1499.002
    support:
      - {src: attack-20.1, locator: "T1499.002 description",
         quote: 'Adversaries may target the different network services provided by systems to conduct a denial of service (DoS). Adversaries often target the availability of DNS and web services; however, others have been targeted as well.'}
    rationale: "Exhausts the connection capacity of a web service. Same as the previous mapping."
  capec:
    decision: CAPEC-469
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-469 Description", quote: 'The idea is to keep the HTTP session alive indefinitely and then repeat that hundreds of times.'}]
    rationale: "HTTP DoS (keeping HTTP sessions alive) is the CAPEC entry linked to T1499.002 that matches the scenario's description of Slowloris."

DDoS_attacks_LOIC_HTTP:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DDoS attacks-LOIC-HTTP'}
  scenario:
    - {src: unb-ids2018, locator: "Table 1", quote: 'Low Orbit Ion Canon (LOIC) for UDP, TCP, or HTTP requests'}
  behaviour:
    text: "Distributed denial of service with HTTP requests against the victim web server."
    support:
      - {src: unb-ids2018, locator: "Table 1", quote: 'Low Orbit Ion Canon (LOIC) for UDP, TCP, or HTTP requests'}
      - {data: claims.port80_all__DDoS_attacks_LOIC_HTTP}
  technique:
    decision: T1499.002
    support:
      - {src: attack-20.1, locator: "T1499.002 description",
         quote: 'Adversaries may target the different network services provided by systems to conduct a denial of service (DoS). Adversaries often target the availability of DNS and web services; however, others have been targeted as well.'}
    rationale: "HTTP requests flooding a web service. Same as the previous mapping."
  capec:
    decision: CAPEC-488
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-488 Description", quote: 'An adversary may execute a flooding attack using the HTTP protocol with the intent to deny legitimate users access to a service by consuming resources at the application layer such as web services and their infrastructure.'}]
    rationale: "The label names HTTP requests; HTTP Flood is the CAPEC entry linked to T1499.002 for floods of HTTP requests."

DDOS_attack_LOIC_UDP:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DDoS-LOIC-UDP'}
  scenario:
    - {src: unb-ids2018, locator: "Table 1", quote: 'Low Orbit Ion Canon (LOIC) for UDP, TCP, or HTTP requests'}
  behaviour:
    text: "Distributed denial of service with UDP traffic sent to the victim server."
    support:
      - {src: unb-ids2018, locator: "Table 1", quote: 'Low Orbit Ion Canon (LOIC) for UDP, TCP, or HTTP requests'}
      - {data: claims.loic_udp_udp_port80}
  technique:
    decision: T1498.001
    support:
      - {src: attack-20.1, locator: "T1498.001 description",
         quote: 'Adversaries may attempt to cause a denial of service (DoS) by directly sending a high-volume of network traffic to a target.'}
      - {src: attack-20.1, locator: "T1498.001 description",
         quote: 'Stateless protocols such as UDP or ICMP are commonly used but stateful protocols such as TCP can be used as well.'}
      - {data: claims.loic_udp_udp_port80}
    rationale: "Every flow of this label is UDP, i.e. a flood of network traffic rather than requests to a service's application logic. Direct Network Flood names UDP floods. CHANGED from the previous mapping T1499.002 (Service Exhaustion Flood), which describes attacks on the services themselves."
  capec:
    decision: CAPEC-125
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-125 Description", quote: 'An adversary consumes the resources of a target by rapidly engaging in a large number of interactions with the target.'}]
    rationale: "Of the CAPEC entries linked to T1498.001 (125, 482, 528, 666), Flooding is the general one; 482 is TCP-specific, 528 is XML-specific and 666 is Bluetooth-specific."

DDOS_attack_HOIC:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'DDOS-HOIC'}
  scenario:
    - {src: unb-ids2018, locator: "2.2.5 Distributed Denial-of-Service",
       quote: 'The High Orbit Ion Cannon, often abbreviated to HOIC, is an open source network stress testing and denial-of-service attack application written in BASIC designed to attack as many as 256 URLs at the same time.'}
    - {src: unb-ids2018, locator: "2.2.5 Distributed Denial-of-Service", quote: 'In this scenario, we use free HOIC tool to conduct DDoS attack by using 4 different computers.'}
  behaviour:
    text: "Distributed denial of service with HTTP requests against the victim web server, sent from several attacking computers."
    support:
      - {src: unb-ids2018, locator: "2.2.5 Distributed Denial-of-Service", quote: 'designed to attack as many as 256 URLs at the same time.'}
      - {src: unb-ids2018, locator: "2.2.5 Distributed Denial-of-Service", quote: 'In this scenario, we use free HOIC tool to conduct DDoS attack by using 4 different computers.'}
      - {data: claims.port80_all__DDOS_attack_HOIC}
  technique:
    decision: T1499.002
    support:
      - {src: attack-20.1, locator: "T1499.002 description",
         quote: 'Adversaries may target the different network services provided by systems to conduct a denial of service (DoS). Adversaries often target the availability of DNS and web services; however, others have been targeted as well.'}
    rationale: "The tool attacks URLs, i.e. a web service. Same as the previous mapping."
  capec:
    decision: CAPEC-488
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-488 Description", quote: 'An adversary may execute a flooding attack using the HTTP protocol with the intent to deny legitimate users access to a service by consuming resources at the application layer such as web services and their infrastructure.'}]
    rationale: "Attacking URLs is an HTTP-level flood; HTTP Flood is the CAPEC entry linked to T1499.002 for it."

Brute_Force_Web:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'Brute Force -Web'}
  scenario:
    - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'In this work, we use Damn Vulnerable Web App (DVWA) to conduct our attacks.'}
    - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'To automate the attacks in XSS and Brute-force section we developed an automation code with Selenium framework.'}
  # checklist 1.2a: the cu khong noi nhan co ca flow khong phai HTTP; ty le (25,5% train / 34,2% val / 0% ngay
  # 22-02) khong dung nen chi noi dang ton tai o cap nhan (claim exists) va cong 80 pho bien nhat (claim top).
  behaviour:
    text: "The dataset page describes automated attacks, scripted with the Selenium framework, on the brute-force section of a deliberately vulnerable web application (DVWA) on the victim web server; an independent analysis of the capture describes repeated password login attempts on a web page. Not every flow carrying this label is HTTP: the label also contains UDP flows and flows to destination ports other than 80, although port 80 is its most common destination port."
    support:
      - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'DVWA is a PHP/MySQL web application that is vulnerable.'}
      - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'To automate the attacks in XSS and Brute-force section we developed an automation code with Selenium framework.'}
      - {src: distrinet-2018, locator: "10. Web Attack - Brute Force, 22-02-2018",
         quote: 'This attack looks mostly like a web-page based attack with repeated password login attempts.'}
      - {data: claims.bfw_has_udp_and_other_ports}
      - {data: claims.bfw_port80_top}
  technique:
    decision: T1110.001
    support:
      - {src: attack-20.1, locator: "T1110.001 description",
         quote: 'Without knowledge of the password for an account, an adversary may opt to systematically guess the password using a repetitive or iterative mechanism.'}
    rationale: "Brute force against a web login guesses passwords. Same as the previous mapping."
  # checklist 6.3: giu CAPEC-49 vi trang dataset khong noi danh sach mat khau dung cho trang dang nhap web
  # (cau "90 million words" chi nam o muc FTP/SSH)
  capec:
    decision: CAPEC-49
    route: taxonomy_mapping
    support: [{src: capec-3.9, locator: "CAPEC-49 Description", quote: 'An adversary tries every possible value for a password until they succeed.'}]
    rationale: "CAPEC-49 is the entry CAPEC links to T1110.001. CAPEC-16 (dictionary) is not chosen here because the dataset page does not describe the password list used against the web login; the dictionary sentence belongs to the FTP and SSH scenario."

Brute_Force_XSS:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'Brute Force -XSS'}
  scenario:
    - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'In this work, we use Damn Vulnerable Web App (DVWA) to conduct our attacks.'}
    - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'To automate the attacks in XSS and Brute-force section we developed an automation code with Selenium framework.'}
  behaviour:
    text: "Automated cross-site scripting (XSS) attempts against a deliberately vulnerable web application (DVWA) on the victim web server."
    support:
      - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'DVWA is a PHP/MySQL web application that is vulnerable.'}
      - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'To automate the attacks in XSS and Brute-force section we developed an automation code with Selenium framework.'}
      - {data: claims.xss_port80_ge90}
  technique:
    decision: T1190
    support:
      - {src: attack-20.1, locator: "T1190 description",
         quote: 'Adversaries may attempt to exploit a weakness in an Internet-facing host or system to initially access a network.'}
      - {src: attack-20.1, locator: "T1189 description (not chosen)",
         quote: 'Adversaries may gain access to a system through a user visiting a website over the normal course of browsing.'}
    rationale: "The captured flows are the attacker's automated requests to the vulnerable web application, i.e. an attempt to exploit a public-facing application. Drive-by Compromise (T1189) describes a user's browser visiting a compromised site, which is not the traffic captured in this scenario. CHANGED from the previous mapping T1189. SQL injection and XSS share T1190 and are told apart by their CAPEC entries."
  capec:
    decision: CAPEC-63
    route: description
    support: [{src: capec-3.9, locator: "CAPEC-63 Description", quote: 'An adversary embeds malicious scripts in content that will be served to web browsers.'}]
    rationale: "CAPEC v3.9 links no attack pattern to T1190; CAPEC-63 Cross-Site Scripting is chosen because it describes the attack named by the label."

SQL_Injection:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'SQL Injection'}
  scenario:
    - {src: unb-ids2018, locator: "1. Introduction, Collection of web application attacks",
       quote: 'we conduct different types of web attacks on the vulnerable website, including SQL injection, command injection, and unrestricted file upload.'}
    - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'In this work, we use Damn Vulnerable Web App (DVWA) to conduct our attacks.'}
  behaviour:
    text: "SQL injection attempts against a deliberately vulnerable web application (DVWA) on the victim web server."
    support:
      - {src: unb-ids2018, locator: "1. Introduction, Collection of web application attacks",
         quote: 'we conduct different types of web attacks on the vulnerable website, including SQL injection, command injection, and unrestricted file upload.'}
      - {src: unb-ids2018, locator: "2.2.6 Web Attacks", quote: 'DVWA is a PHP/MySQL web application that is vulnerable.'}
      - {data: claims.port80_all__SQL_Injection}
  technique:
    decision: T1190
    support:
      - {src: attack-20.1, locator: "T1190 description",
         quote: 'Adversaries may attempt to exploit a weakness in an Internet-facing host or system to initially access a network.'}
    rationale: "SQL injection exploits a weakness of a public-facing web application. Same as the previous mapping."
  capec:
    decision: CAPEC-66
    route: description
    support: [{src: capec-3.9, locator: "CAPEC-66 Description", quote: 'This attack exploits target software that constructs SQL statements based on user input.'}]
    rationale: "CAPEC v3.9 links no attack pattern to T1190; CAPEC-66 SQL Injection is chosen because it describes the attack named by the label."

Infiltration:
  dataset_name: {src: unb-ids2018, locator: "Table 2", quote: 'Infiltration'}
  scenario:
    - {src: unb-ids2018, locator: "1. Introduction, Infiltration of the network from inside",
       quote: 'In this scenario, we send a malicious file via an email to the victim and exploit an application vulnerability.'}
    - {src: unb-ids2018, locator: "1. Introduction, Infiltration of the network from inside",
       quote: 'we use his computer to scan the internal network for other vulnerable boxes and exploit them if possible.'}
    - {src: unb-ids2018, locator: "2.2.7 Infiltration of the network from inside", quote: 'IP sweep, full port scan and service enumerations using Nmap.'}
  # checklist 1.2b: bo "e-mail attachment" (trang UNB khong co chu nay, va mo ta hai cach xam nhap khac nhau:
  # email o muc 1, Dropbox o Table 1). Ty le DNS/HTTPS khong dung -> nguong "at least a tenth" (claim dung o
  # moi nguon, min 12,8%). Rationale cu "no destination port above 30%" SAI (val 30,4%, ngay 28-02 35,7%).
  behaviour:
    text: "The dataset page describes this label as the internal stage of an infiltration scenario: a compromised victim host was used for an IP sweep, a full port scan and service enumeration of the internal network with Nmap. The label is not limited to scan traffic: at least a tenth of its flows go to DNS (UDP port 53), at least a tenth go to HTTPS (TCP port 443), and no single destination port carries half of its flows."
    support:
      - {src: unb-ids2018, locator: "2.2.7 Infiltration of the network from inside", quote: 'IP sweep, full port scan and service enumerations using Nmap.'}
      - {src: unb-ids2018, locator: "1. Introduction, Infiltration of the network from inside",
         quote: 'we use his computer to scan the internal network for other vulnerable boxes and exploit them if possible.'}
      - {data: claims.infil_udp53_ge10}

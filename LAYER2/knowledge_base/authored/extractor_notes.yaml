- id: XN-ACT-DATA-FIRST-PACKET
  relation: replaces
  applies_to: [Fwd Act Data Pkts]
  text: "In CSE-CIC-IDS2018 this column counts the forward packets after the first one that carry at least 1 byte of payload; the first packet of the flow is never counted. The value is therefore at most the forward packet count minus 1, and a flow whose only forward payload is in its first packet shows 0."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'if(packet.getPayloadBytes() >=1){ this.Act_data_pkt_forward++; }'}
    - {data: claims.act_data_le_fwd_minus1}

# checklist 1.5a: them co che window scaling (RFC 7323); so lieu doi sang bat bien (claims) thay cho ty le
- id: XN-INIT-WIN
  relation: replaces
  applies_to: [Init Fwd Win Byts, Init Bwd Win Byts]
  text: "In CSE-CIC-IDS2018 this column is the raw TCP window field of a single packet header, not a byte count: for the forward direction it comes from the first packet of the flow, and for the backward direction from the most recent backward packet (the value is overwritten on each one). The field is recorded as read, without the window scale factor, so unless that packet is a SYN or SYN-ACK segment the real window can be larger than the recorded value. -1 is the extractor's default, kept when no TCP window was read: every UDP flow has -1 in the forward column, no TCP flow has -1 in the forward column, and no TCP flow with at least one backward packet has -1 in the backward column."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicPacketInfo.java, field declaration", quote: 'private int TCPWindow=-1;'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, field declarations",
       quote: 'private int Init_Win_bytes_forward=-1; private int Init_Win_bytes_backward=-1;'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setTCPWindow(tcp.window());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), forward branch",
       quote: 'this.min_seg_size_forward = packet.getHeaderBytes(); Init_Win_bytes_forward = packet.getTCPWindow();'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket(), backward branch",
       quote: 'this.bwdPktStats.addValue((double)packet.getPayloadBytes()); Init_Win_bytes_backward = packet.getTCPWindow();'}
    - {src: rfc7323, locator: "Section 2.2",
       quote: 'The window field in a segment where the SYN bit is set (i.e., a <SYN> or <SYN,ACK>) MUST NOT be scaled.'}
    - {src: rfc9293, locator: "Section 3.1, Header Format", quote: 'The value is shifted when the window scaling extension is used [47].'}
    - {data: claims.init_fwd_win_tcp_16bit}
    - {data: claims.udp_flags_zero_init_fwd_minus1}
    - {data: claims.tcp_init_fwd_never_minus1}
    - {data: claims.tcp_with_bwd_init_bwd_never_minus1}

# checklist 4.2: CICFlowMeter.java (ban dong lenh) bi build.gradle loai khoi ban build; timeout trich tu GUI
# (gia tri mac dinh, sua duoc) va worker bat goi truc tiep. Gia tri ma tac gia dataset dung khong duoc ghi;
# du lieu khop voi no (claim duration_le_120s).
- id: XN-FLOW-TIMEOUT
  relation: adds
  applies_to: [Flow Duration]
  text: "The extractor's default flow timeout is 120 s (120,000,000 microseconds): a flow is closed when a packet arrives more than that after the flow's first packet, and that packet starts a new flow. No flow in the published CSE-CIC-IDS2018 CSV files lasts longer than that."
  support:
    - {src: cicflowmeter-src-2018, locator: "FlowOfflinePane.java, initSettingPane()", quote: 'param1Ele.add(120000000L);'}
    - {src: cicflowmeter-src-2018, locator: "ReadPcapFileWorker.java, constructor", quote: 'flowTimeout = 120000000L;'}
    - {src: cicflowmeter-src-2018, locator: "TrafficFlowWorker.java, doInBackground()",
       quote: 'FlowGenerator flowGen = new FlowGenerator(true,120000000L, 5000000L);'}
    - {src: cicflowmeter-src-2018, locator: "build.gradle, jar task", quote: "exclude '**/CICFlowMeter.java'"}
    - {src: cicflowmeter-src-2018, locator: "FlowGenerator.java, addPacket()",
       quote: 'if((currentTimestamp -flow.getFlowStartTime())>flowTimeOut){'}
    - {data: claims.duration_le_120s}

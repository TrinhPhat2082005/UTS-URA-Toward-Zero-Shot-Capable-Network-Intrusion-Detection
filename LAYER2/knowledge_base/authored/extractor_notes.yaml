- id: XN-BWD-FLAGS-ZERO
  relation: replaces
  applies_to: [Bwd PSH Flags, Bwd URG Flags]
  text: "In the published CSE-CIC-IDS2018 CSV files this column is always 0: the backward PSH and URG counters are incremented only in the first-packet routine, and the first packet always defines the forward direction."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'if(this.src==null){ this.src = packet.getSrc();'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), backward branch",
       quote: 'if(packet.hasFlagPSH()){ this.bPSH_cnt++; } if(packet.hasFlagURG()){ this.bURG_cnt++; }'}
    - {data: claims.bwd_dir_flags_zero}

- id: XN-BULK-ZERO
  relation: replaces
  applies_to: [Fwd Byts/b Avg, Fwd Pkts/b Avg, Fwd Blk Rate Avg, Bwd Byts/b Avg, Bwd Pkts/b Avg, Bwd Blk Rate Avg]
  text: "In the published CSE-CIC-IDS2018 CSV files this column is always 0: bulk statistics are updated only for the first packet of a flow (the update is disabled for later packets), so no bulk transfer is ever recorded."

# Ghi chu ve CACH CICFlowMeter-V3 (ban 2018) tinh tung cot. Gan vao doan H1 cua cot o `applies_to`.
#
# Moi `text` la trich dan dien giai (tieng Anh); no chi duoc noi dieu ma cac `support` cho thay: dong code
# nguyen van tai commit 50d668db, tai lieu Java/RFC, hoac claim so lieu da kiem tinh dung
# ({data: claims.<id>}, build/claims.py: dung tren train, val va moi file CSV goc). validate.py kiem moi quote
# nguyen van va moi claim; nguoi duyet doc cau `text` canh bang chung trong store/build_report.md.
#
# relation (checklist 1.1):
#   replaces  dinh nghia ReadMe SAI voi dataset nay. part_feature.py dat cac ghi chu nay len dau doan H1 va
#             BO dinh nghia ReadMe khoi text gui VLM (ReadMe chi con trong feature_names.yaml va support).
#             Vi vay cau `text` phai tu dung duoc, mo dau bang nghia that.
#   adds      dinh nghia ReadMe dung nhung thieu; giu ReadMe, them ghi chu phia sau.
#
# {holds} / {named} duoc part_feature.py dien: co ma cot THUC SU chua / co trong ten cot.

- id: XN-TIME-MICROSECONDS
  relation: adds
  applies_to: [Flow Duration, Flow IAT Mean, Flow IAT Std, Flow IAT Max, Flow IAT Min,
               Fwd IAT Tot, Fwd IAT Mean, Fwd IAT Std, Fwd IAT Max, Fwd IAT Min,
               Bwd IAT Tot, Bwd IAT Mean, Bwd IAT Std, Bwd IAT Max, Bwd IAT Min,
               Active Mean, Active Std, Active Max, Active Min, Idle Mean, Idle Std, Idle Max, Idle Min]
  text: "Times are in microseconds: the extractor reads packet timestamps in microseconds."
  support:
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, IPv4 packet parsing",
       quote: 'packetInfo.setTimeStamp(packet.getCaptureHeader().timestampInMicros());'}
    - {src: cicflowmeter-readme, locator: "ReadMe.txt, list of extracted features",
       quote: 'Flow duration Duration of the flow in Microsecond'}

- id: XN-PAYLOAD-BYTES
  relation: adds
  applies_to: [TotLen Fwd Pkts, TotLen Bwd Pkts, Fwd Pkt Len Max, Fwd Pkt Len Min, Fwd Pkt Len Mean, Fwd Pkt Len Std,
               Bwd Pkt Len Max, Bwd Pkt Len Min, Bwd Pkt Len Mean, Bwd Pkt Len Std,
               Pkt Len Min, Pkt Len Max, Pkt Len Mean, Pkt Len Std, Pkt Len Var,
               Pkt Size Avg, Fwd Seg Size Avg, Bwd Seg Size Avg, Subflow Fwd Byts, Subflow Bwd Byts]
  text: "Lengths count transport-layer payload bytes (the TCP or UDP payload), not packet headers."
  support:
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch",
       quote: 'packetInfo.setPayloadBytes(tcp.getPayloadLength());'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, UDP branch",
       quote: 'packetInfo.setPayloadBytes(udp.getPayloadLength());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'this.fwdPktStats.addValue((double)packet.getPayloadBytes());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, getAvgPacketSize()",
       quote: 'return (this.flowLengthStats.getSum()/this.packetCount());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, fAvgSegmentSize()",
       quote: 'return (this.fwdPktStats.getSum() / (double)this.forward.size());'}

# checklist 1.5b: goi dau duoc cong hai lan vao flowLengthStats (claim pkt_len_double_count dung o moi nguon)
- id: XN-FIRST-PACKET-TWICE
  relation: adds
  applies_to: [Pkt Len Mean, Pkt Len Std, Pkt Len Var, Pkt Size Avg]
  text: "The extractor adds the payload length of the flow's first packet twice to the statistics over all packets, so the first packet counts double: the mean, standard deviation and variance are taken over one more value than the flow has packets, and the average packet size divides that sum by the real packet count."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'this.endActiveTime = packet.getTimeStamp(); this.flowLengthStats.addValue((double)packet.getPayloadBytes());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), forward branch",
       quote: 'Init_Win_bytes_forward = packet.getTCPWindow(); this.flowLengthStats.addValue((double)packet.getPayloadBytes());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, getAvgPacketSize()",
       quote: 'return (this.flowLengthStats.getSum()/this.packetCount());'}
    - {data: claims.pkt_len_double_count}

# checklist 1.5c: Down/Up Ratio la phep chia nguyen (claim downup_integer dung o moi nguon)
- id: XN-DOWNUP-INTEGER
  relation: adds
  applies_to: [Down/Up Ratio]
  text: "The extractor divides the backward packet count by the forward packet count with integer division, so the fraction is dropped: the value is 0 whenever the flow has fewer backward than forward packets, and it never has a fractional part."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, getDownUpRatio()",
       quote: 'return (double)(this.backward.size()/this.forward.size());'}
    - {data: claims.downup_integer}

- id: XN-SEG-SIZE-MIN-IS-HEADER
  relation: replaces
  applies_to: [Fwd Seg Size Min]
  text: "In CSE-CIC-IDS2018 this column is the smallest transport-header length, in bytes, among the forward packets of the flow (between 20 and 60 for TCP, 8 for UDP); it is not a payload or segment size."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'this.min_seg_size_forward = Math.min(packet.getHeaderBytes(),this.min_seg_size_forward);'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch",
       quote: 'packetInfo.setHeaderBytes(tcp.getHeaderLength());'}
    - {data: claims.seg_size_min_is_header}

- id: XN-FLAGS-FIRST-PACKET
  relation: replaces
  applies_to: [FIN Flag Cnt, SYN Flag Cnt, RST Flag Cnt, PSH Flag Cnt, ACK Flag Cnt, URG Flag Cnt, CWE Flag Count,
               ECE Flag Cnt, Fwd PSH Flags, Fwd URG Flags]
  text: "In CSE-CIC-IDS2018 this column is 1 if the first packet of the flow has the {holds} flag set and 0 otherwise. It describes that packet only and is not a count of packets: the extractor reads flags only from the first packet of a flow."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'public void firstPacket(BasicPacketInfo packet){ updateFlowBulk(packet); detectUpdateSubflows(packet); checkFlags(packet);'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'public void addPacket(BasicPacketInfo packet){ //updateFlowBulk(packet); //detectUpdateSubflows(packet); //checkFlags(packet);'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), forward branch",
       quote: 'if(packet.hasFlagPSH()){ this.fPSH_cnt++; } if(packet.hasFlagURG()){ this.fURG_cnt++; }'}
    - {data: claims.flags_binary}

# flag_column_holds (data_facts) la thu tu duyet HashMap do code tinh lai (data_facts.java_hashmap_order);
# du lieu xac nhan doc lap 3 vi tri bang cac cap cot trung nhau (claims identical/near_identical ben duoi).
- id: XN-FLAG-ORDER
  relation: replaces
  applies_to: [FIN Flag Cnt, SYN Flag Cnt, RST Flag Cnt, PSH Flag Cnt, URG Flag Cnt, CWE Flag Count, ECE Flag Cnt]
  text: "The column name does not match its content: the extractor writes the eight flag values in the iteration order of a Java HashMap, which does not follow the order of the column names, so this column holds the {holds} flag and not the {named} flag."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, field declaration",
       quote: 'private HashMap<String, MutableInt> flagCounts;'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, initFlags()",
       quote: 'flagCounts.put("FIN", new MutableInt()); flagCounts.put("SYN", new MutableInt()); flagCounts.put("RST", new MutableInt()); flagCounts.put("PSH", new MutableInt()); flagCounts.put("ACK", new MutableInt()); flagCounts.put("URG", new MutableInt()); flagCounts.put("CWR", new MutableInt()); flagCounts.put("ECE", new MutableInt());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, CSV row writer",
       quote: 'for(String key: flagCounts.keySet()){ dump.append(flagCounts.get(key).value).append(separator); //50,51,52,53,54,55,56,57'}
    - {src: java8-hashmap, locator: "class description",
       quote: 'This class makes no guarantees as to the order of the map; in particular, it does not guarantee that the order will remain constant over time.'}
    # checklist 4.3 (ban nhe): thu tu duyet do data_facts.java_hashmap_order() tinh lai dung hai ham cua OpenJDK 8,
    # ban Java ma build.gradle khai bao; commit 6833ccd4 cua chinh CICFlowMeter sau do ghi co theo thu tu tuong minh.
    - {src: openjdk8-src, locator: "HashMap.java, hash()", quote: 'return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);'}
    - {src: openjdk8-src, locator: "HashMap.java, putVal()", quote: 'if ((p = tab[i = (n - 1) & hash]) == null)'}
    - {src: openjdk8-src, locator: "String.java, hashCode()", quote: 'h = 31 * h + val[i];'}
    - {src: cicflowmeter-src-2018, locator: "build.gradle", quote: 'sourceCompatibility = 1.8'}
    - {src: cicflowmeter-src-2018-06, locator: "BasicFlow.java, CSV row writer",
       quote: 'dump.append(flagCounts.get("FIN").value).append(separator); //50 dump.append(flagCounts.get("SYN").value).append(separator); //51'}
    - {data: flag_column_holds}
    - {data: "claims.identical__Fwd PSH Flags__SYN Flag Cnt"}
    - {data: "claims.identical__Fwd URG Flags__CWE Flag Count"}
    - {data: "claims.near_identical__RST Flag Cnt__ECE Flag Cnt"}


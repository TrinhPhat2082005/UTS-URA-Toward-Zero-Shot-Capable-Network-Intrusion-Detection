# Nguon cua knowledge base. Moi trich dan trong authored/*.yaml va store/passages.jsonl tro toi
# mot `id` o day; fetch_sources.py tai file ve $UTS_DATA/kb_sources/<id>/ va ghi sha256 vao
# store/sources.lock.json. Chi dung nguon thuoc cac tang duoi (xem knowledge_base/README.md).
#
# tier:
#   standard   chuan (IANA, IETF RFC)
#   knowledge  tri thuc chuan cua MITRE (ATT&CK, CAPEC)
#   dataset    nguon goc cua dataset (trang CSE-CIC-IDS2018 cua UNB/CIC)
#   tool       nguon goc cua cong cu trich xuat (ReadMe + ma nguon CICFlowMeter)
#   platform   tai lieu chinh thuc cua nen tang ma cong cu chay tren (Java SE)
#   system     ma nguon cua chinh he thong nay (dinh nghia feature AE cua Layer 1)

- id: unb-ids2018

# Dinh nghia cot theo dung phien ban CICFlowMeter-V3 ma CSE-CIC-IDS2018 dung (ma nguon @50d668db). Gan vao doan
# H1 cua cot o `applies_to`. Khi ReadMe va ma nguon cua phien ban nay khac nhau, dinh nghia theo ma nguon.
#
# Moi `text` la dinh nghia (tieng Anh) chi noi dieu ma `support` cho thay: dong code nguyen van tai 50d668db, tai
# lieu Java/RFC/OpenJDK, hoac tai lieu doc lap ve CICFlowMeter (Engelen et al. 2021, trang DistriNet cua
# Liu et al. 2022). validate.py kiem moi quote nguyen van. KHONG co so lieu tu tinh tu dataset.
#
# relation:
#   replaces  ReadMe khong dung voi phien ban 2018 -> part_feature.py dung cac ghi chu nay lam dinh nghia cua cot
#             (ReadMe khong vao text gui VLM). Cau `text` phai tu dung duoc.
#   adds      ReadMe dung nhung thieu -> giu ReadMe, them ghi chu phia sau.
# {holds} / {named}: part_feature.py dien co ma cot THUC SU chua / co trong ten cot (build/flag_order.py).

- id: XN-TIME-MICROSECONDS
  relation: adds
  applies_to: [Flow Duration, Flow IAT Mean, Flow IAT Std, Flow IAT Max, Flow IAT Min,
               Fwd IAT Tot, Fwd IAT Mean, Fwd IAT Std, Fwd IAT Max, Fwd IAT Min,
               Bwd IAT Tot, Bwd IAT Mean, Bwd IAT Std, Bwd IAT Max, Bwd IAT Min,
               Active Mean, Active Std, Active Max, Active Min, Idle Mean, Idle Std, Idle Max, Idle Min]
  text: "Times are in microseconds: the extractor reads packet timestamps in microseconds."
  support:
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, IPv4 packet parsing",
       quote: 'packetInfo.setTimeStamp(packet.getCaptureHeader().timestampInMicros());'}
    - {src: cicflowmeter-readme, locator: "ReadMe.txt, list of extracted features",
       quote: 'Flow duration Duration of the flow in Microsecond'}

- id: XN-PAYLOAD-BYTES
  relation: adds
  applies_to: [TotLen Fwd Pkts, TotLen Bwd Pkts, Fwd Pkt Len Max, Fwd Pkt Len Min, Fwd Pkt Len Mean, Fwd Pkt Len Std,
               Bwd Pkt Len Max, Bwd Pkt Len Min, Bwd Pkt Len Mean, Bwd Pkt Len Std,
               Pkt Len Min, Pkt Len Max, Pkt Len Mean, Pkt Len Std, Pkt Len Var,
               Pkt Size Avg, Fwd Seg Size Avg, Bwd Seg Size Avg, Subflow Fwd Byts, Subflow Bwd Byts]
  text: "Lengths count transport-layer payload bytes (the TCP or UDP payload), not packet headers."
  support:
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch",
       quote: 'packetInfo.setPayloadBytes(tcp.getPayloadLength());'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, UDP branch",
       quote: 'packetInfo.setPayloadBytes(udp.getPayloadLength());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'this.fwdPktStats.addValue((double)packet.getPayloadBytes());'}

- id: XN-FIRST-PACKET-TWICE
  relation: adds
  applies_to: [Pkt Len Mean, Pkt Len Std, Pkt Len Var, Pkt Size Avg]
  text: "The extractor adds the payload length of the flow's first packet twice to the statistics over all packets, so the first packet counts double: the mean, standard deviation and variance are taken over one more value than the flow has packets, and the average packet size divides that sum by the real packet count."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'this.endActiveTime = packet.getTimeStamp(); this.flowLengthStats.addValue((double)packet.getPayloadBytes());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), forward branch",
       quote: 'Init_Win_bytes_forward = packet.getTCPWindow(); this.flowLengthStats.addValue((double)packet.getPayloadBytes());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, getAvgPacketSize()",
       quote: 'return (this.flowLengthStats.getSum()/this.packetCount());'}

- id: XN-DOWNUP-INTEGER
  relation: adds
  applies_to: [Down/Up Ratio]
  text: "The extractor divides the backward packet count by the forward packet count with integer division, so the fraction is dropped: the value is 0 whenever the flow has fewer backward than forward packets, and it never has a fractional part."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, getDownUpRatio()",
       quote: 'return (double)(this.backward.size()/this.forward.size());'}

- id: XN-SEG-SIZE-MIN-IS-HEADER
  relation: replaces
  applies_to: [Fwd Seg Size Min]
  text: "In CSE-CIC-IDS2018 this column is the smallest transport-header length, in bytes, among the forward packets of the flow; it is not a payload or segment size."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'this.min_seg_size_forward = Math.min(packet.getHeaderBytes(),this.min_seg_size_forward);'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch",
       quote: 'packetInfo.setHeaderBytes(tcp.getHeaderLength());'}

- id: XN-FLAGS-FIRST-PACKET
  relation: replaces
  applies_to: [FIN Flag Cnt, SYN Flag Cnt, RST Flag Cnt, PSH Flag Cnt, ACK Flag Cnt, URG Flag Cnt, CWE Flag Count,
               ECE Flag Cnt, Fwd PSH Flags, Fwd URG Flags]
  text: "In CSE-CIC-IDS2018 this column is 1 if the first packet of the flow has the {holds} flag set and 0 otherwise. It describes that packet only and is not a count of packets: the extractor reads flags only from the first packet of a flow."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'public void firstPacket(BasicPacketInfo packet){ updateFlowBulk(packet); detectUpdateSubflows(packet); checkFlags(packet);'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'public void addPacket(BasicPacketInfo packet){ //updateFlowBulk(packet); //detectUpdateSubflows(packet); //checkFlags(packet);'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), forward branch",
       quote: 'if(packet.hasFlagPSH()){ this.fPSH_cnt++; } if(packet.hasFlagURG()){ this.fURG_cnt++; }'}
    - {src: engelen-2021-doc, locator: "extended_doc.html, Flow Construction, TCP flag count",
       quote: 'This was due to a bug in the CICFlowMeter tool which only incremented the count of TCP flags for the first packet in a flow.'}
    - {src: engelen-2021-doc, locator: "extended_doc.html, Flow Construction, TCP flag count",
       quote: 'As a result, this issue may affect any dataset that was generated with the CICFlowMeter-V3 tool before this fix was implemented.'}

# Bang "cot -> co thuc chua" do build/flag_order.py tinh lai tu ma nguon 2018 va thuat toan HashMap cua OpenJDK 8.
- id: XN-FLAG-ORDER
  relation: replaces
  applies_to: [FIN Flag Cnt, SYN Flag Cnt, RST Flag Cnt, PSH Flag Cnt, URG Flag Cnt, CWE Flag Count, ECE Flag Cnt]
  text: "The column name does not match its content: the extractor writes the eight flag values in the iteration order of a Java HashMap, which does not follow the order of the column names, so this column holds the {holds} flag and not the {named} flag."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, field declaration",
       quote: 'private HashMap<String, MutableInt> flagCounts;'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, initFlags()",
       quote: 'flagCounts.put("FIN", new MutableInt()); flagCounts.put("SYN", new MutableInt()); flagCounts.put("RST", new MutableInt()); flagCounts.put("PSH", new MutableInt()); flagCounts.put("ACK", new MutableInt()); flagCounts.put("URG", new MutableInt()); flagCounts.put("CWR", new MutableInt()); flagCounts.put("ECE", new MutableInt());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, CSV row writer",
       quote: 'for(String key: flagCounts.keySet()){ dump.append(flagCounts.get(key).value).append(separator); //50,51,52,53,54,55,56,57'}
    - {src: java8-hashmap, locator: "class description",
       quote: 'This class makes no guarantees as to the order of the map; in particular, it does not guarantee that the order will remain constant over time.'}
    - {src: openjdk8-src, locator: "HashMap.java, hash()", quote: 'return (key == null) ? 0 : (h = key.hashCode()) ^ (h >>> 16);'}
    - {src: openjdk8-src, locator: "HashMap.java, putVal()", quote: 'if ((p = tab[i = (n - 1) & hash]) == null)'}
    - {src: openjdk8-src, locator: "String.java, hashCode()", quote: 'h = 31 * h + val[i];'}
    - {src: cicflowmeter-src-2018, locator: "build.gradle", quote: 'sourceCompatibility = 1.8'}
    - {src: cicflowmeter-src-2018-06, locator: "BasicFlow.java, CSV row writer",
       quote: 'dump.append(flagCounts.get("FIN").value).append(separator); //50 dump.append(flagCounts.get("SYN").value).append(separator); //51'}

- id: XN-CWE-NAME
  relation: adds
  applies_to: [CWE Flag Count]
  text: "'CWE' in this column name is the 2018 extractor's name for its CWR counter; later versions of the extractor call the column 'CWR Flag Count'."
  support:
    - {src: cicflowmeter-src-2018, locator: "FlowFeature.java, feature //56", quote: 'cwe_cnt("CWE Flag Count","CWECT"'}
    - {src: cicflowmeter-readme, locator: "FlowFeature.java (master), feature //56", quote: 'CWR_cnt("CWR Flag Count","CWRCT"'}

- id: XN-BWD-FLAGS-ZERO
  relation: replaces
  applies_to: [Bwd PSH Flags, Bwd URG Flags]
  text: "In CSE-CIC-IDS2018 this column is always 0: the backward PSH and URG counters are incremented only in the first-packet routine, and the first packet always defines the forward direction."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket()",
       quote: 'if(this.src==null){ this.src = packet.getSrc();'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), backward branch",
       quote: 'if(packet.hasFlagPSH()){ this.bPSH_cnt++; } if(packet.hasFlagURG()){ this.bURG_cnt++; }'}
    - {src: engelen-2021-doc, locator: "extended_doc.html, Flow Construction, TCP flag count",
       quote: 'Similarly, the values for Fwd PSH Flags, Bwd PSH Flags, Fwd URG Flags and Bwd URG Flags were not being correctly incremented in the CICFlowMeter tool.'}

- id: XN-BULK-ZERO
  relation: replaces
  applies_to: [Fwd Byts/b Avg, Fwd Pkts/b Avg, Fwd Blk Rate Avg, Bwd Byts/b Avg, Bwd Pkts/b Avg, Bwd Blk Rate Avg]
  text: "In CSE-CIC-IDS2018 this column is always 0: bulk statistics are updated only for the first packet of a flow (the update is disabled for later packets), so no bulk transfer is ever recorded."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'public void addPacket(BasicPacketInfo packet){ //updateFlowBulk(packet); //detectUpdateSubflows(packet); //checkFlags(packet);'}

- id: XN-SUBFLOW-ONE
  relation: adds
  applies_to: [Subflow Fwd Pkts, Subflow Fwd Byts, Subflow Bwd Pkts, Subflow Bwd Byts]
  text: "Subflow detection runs only for the first packet of a flow, so every flow counts as a single subflow and these columns repeat the flow totals."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'public void addPacket(BasicPacketInfo packet){ //updateFlowBulk(packet); //detectUpdateSubflows(packet); //checkFlags(packet);'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, getSflow_fpackets()",
       quote: 'return this.forward.size()/sfCount;'}

- id: XN-ACT-DATA-FIRST-PACKET
  relation: replaces
  applies_to: [Fwd Act Data Pkts]
  text: "In CSE-CIC-IDS2018 this column counts the forward packets after the first one that carry at least 1 byte of payload; the first packet of the flow is never counted, so a flow whose only forward payload is in its first packet shows 0."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket()",
       quote: 'if(packet.getPayloadBytes() >=1){ this.Act_data_pkt_forward++; }'}

- id: XN-INIT-WIN
  relation: replaces
  applies_to: [Init Fwd Win Byts, Init Bwd Win Byts]
  text: "In CSE-CIC-IDS2018 this column is the raw TCP window field of a single packet header, not a byte count: for the forward direction it comes from the first packet of the flow, and for the backward direction from the most recent backward packet (the value is overwritten on each one). The field is recorded as read, without the window scale factor, so unless that packet is a SYN or SYN-ACK segment the real window can be larger than the recorded value. -1 is the extractor's default, kept when no TCP window was read, for example in a UDP flow or when there is no backward packet."
  support:
    - {src: cicflowmeter-src-2018, locator: "BasicPacketInfo.java, field declaration", quote: 'private int TCPWindow=-1;'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, field declarations",
       quote: 'private int Init_Win_bytes_forward=-1; private int Init_Win_bytes_backward=-1;'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setTCPWindow(tcp.window());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, firstPacket(), forward branch",
       quote: 'this.min_seg_size_forward = packet.getHeaderBytes(); Init_Win_bytes_forward = packet.getTCPWindow();'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, addPacket(), backward branch",
       quote: 'this.bwdPktStats.addValue((double)packet.getPayloadBytes()); Init_Win_bytes_backward = packet.getTCPWindow();'}
    - {src: rfc7323, locator: "Section 2.2",
       quote: 'The window field in a segment where the SYN bit is set (i.e., a <SYN> or <SYN,ACK>) MUST NOT be scaled.'}
    - {src: rfc9293, locator: "Section 3.1, Header Format", quote: 'The value is shifted when the window scaling extension is used [47].'}

- id: XN-FLOW-TIMEOUT
  relation: adds
  applies_to: [Flow Duration]
  text: "The extractor's default flow timeout is 120 s (120,000,000 microseconds): a flow is closed when a packet arrives more than that after the flow's first packet, and that packet starts a new flow."
  support:
    - {src: cicflowmeter-src-2018, locator: "FlowOfflinePane.java, initSettingPane()", quote: 'param1Ele.add(120000000L);'}
    - {src: cicflowmeter-src-2018, locator: "ReadPcapFileWorker.java, constructor", quote: 'flowTimeout = 120000000L;'}
    - {src: cicflowmeter-src-2018, locator: "FlowGenerator.java, addPacket()",
       quote: 'if((currentTimestamp -flow.getFlowStartTime())>flowTimeOut){'}
    - {src: distrinet-2018, locator: "CSECICIDS2018.html, DoS Slowloris",
       quote: 'With the timeout value of the CICFlowMeter being set to 120 seconds when processing this dataset, a single DoS Slowloris TCP connection will be split over multiple flows.'}

# H1 cho cac chieu KHONG co dong dinh nghia trong ReadMe CICFlowMeter:
#   - Dst Port, Protocol: ReadMe khong liet ke; dinh nghia theo trang dataset UNB + ma nguon 2018.
#   - cac chieu Layer 1 (variant ae_xgboost) them vao 78 cot CSV: dinh nghia chung cua autoencoder
#     (latent = mot toa do cua tang an/bottleneck; recon error = sai so binh phuong trung binh), trich ma Layer 1
#     cua repo (tier "system"). 16 chieu latent gop thanh MOT doan. Khong dien giai them.

- pid: H1-Dst_Port
  applies_to: [Dst Port]
  text: "Destination port of the flow: the TCP or UDP port of the destination host, read from the transport header of the flow's packets."
  support:
    - {src: unb-ids2018, locator: "3. Feature extraction",
       quote: 'six columns labeled for each flow, namely FlowID, SourceIP, DestinationIP, SourcePort, DestinationPort, and Protocol'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setDstPort(tcp.destination());'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, UDP branch", quote: 'packetInfo.setDstPort(udp.destination());'}

- pid: H1-Protocol
  applies_to: [Protocol]
  text: "Transport protocol of the flow as an IP protocol number: the extractor writes 6 for TCP, 17 for UDP, and 0 when neither header was found."
  support:
    - {src: unb-ids2018, locator: "3. Feature extraction",
       quote: 'six columns labeled for each flow, namely FlowID, SourceIP, DestinationIP, SourcePort, DestinationPort, and Protocol'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setProtocol(6);'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, UDP branch", quote: 'packetInfo.setProtocol(17);'}
    - {src: java8-jls, locator: "Section 4.12.5, Initial Values of Variables", quote: 'For type int, the default value is zero, that is, 0.'}

- pid: H1-ae_recon_error
  applies_to: [ae_recon_error]
  text: "Reconstruction error of the autoencoder: the mean squared error between the flow's scaled features and the autoencoder's reconstruction of them."
  support:
    - {src: layer1-code, locator: "autoencoder.py, reconstruction_error()", quote: 'return ((x - x_hat) ** 2).mean(dim=1)'}
    - {src: layer1-code, locator: "train_protocol_b.py, AE features",
       quote: 'names = feats + [f"ae_latent_{i}" for i in range(AE_BOTTLENECK)] + ["ae_recon_error"]'}

- pid: H1-ae_latent
  applies_to: [ae_latent_0, ae_latent_1, ae_latent_2, ae_latent_3, ae_latent_4, ae_latent_5, ae_latent_6, ae_latent_7,
               ae_latent_8, ae_latent_9, ae_latent_10, ae_latent_11, ae_latent_12, ae_latent_13, ae_latent_14, ae_latent_15]
  text: "One of the 16 coordinates of the autoencoder's latent (bottleneck) layer, the layer that encodes the flow's scaled features."
  support:
    - {src: layer1-code, locator: "autoencoder.py, module docstring", quote: 'Encoder: input_dim -> 64 -> 32 -> bottleneck_dim'}
    - {src: layer1-code, locator: "train_protocol_b.py, configuration", quote: 'AE_BOTTLENECK = 16'}
    - {src: layer1-code, locator: "train_protocol_b.py, AE features",
       quote: 'names = feats + [f"ae_latent_{i}" for i in range(AE_BOTTLENECK)] + ["ae_recon_error"]'}

# H3: doan giai thich mot gia tri do CONG CU TRICH XUAT sinh ra, doc thang tu flow. Chi dua vao context khi `when`
# dung voi gia tri tho cua alert (knowledge_base/conditions.py danh gia, khong dung eval); `when: null` -> luon chon.
# Cau `text` (tieng Anh) noi CO CHE (gia tri nay sinh ra the nao), khong phan xet flow co phai tan cong hay khong.
# Support chi la trich dan nguyen van (ma nguon 2018, RFC, JLS, IANA, audit doc lap). KHONG co so lieu tu tinh.

- pid: H3-NOPAYLOAD
  when: {all: [["TotLen Fwd Pkts", "==", 0], ["TotLen Bwd Pkts", "==", 0]]}
  text: "This flow carries no transport-layer payload in either direction, so application content (for example an HTTP request or an SQL statement) cannot be observed in it. The extractor ends a TCP flow at the first FIN packet, and a packet that arrives when no flow is open starts a new flow, so the last packets of a connection can form a flow of their own."
  support:
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setPayloadBytes(tcp.getPayloadLength());'}
    - {src: cicflowmeter-src-2018, locator: "FlowGenerator.java, addPacket()", quote: '// Flow finished due FIN flag (tcp only):'}
    - {src: cicflowmeter-src-2018, locator: "FlowGenerator.java, addPacket()", quote: '}else if(packet.hasFlagFIN()){'}
    - {src: cicflowmeter-src-2018, locator: "FlowGenerator.java, addPacket(), packet without an open flow",
       quote: 'currentFlows.put(packet.getFlowId(), new BasicFlow(bidirectional,packet));'}

- pid: H3-NOWIN
  when: {any: [["Init Fwd Win Byts", "==", -1], ["Init Bwd Win Byts", "==", -1]]}
  text: "A value of -1 in an initial-window column is not a window size: the TCP window field is a 16-bit count of octets. It is the extractor's default, kept when no TCP window was read for that direction, for example in a UDP flow or in a flow without backward packets."
  support:
    - {src: rfc9293, locator: "Section 3.1, Header Format",
       quote: 'Window: 16 bits The number of data octets beginning with the one indicated in the acknowledgment field that the sender of this segment is willing to accept. The value is shifted when the window scaling extension is used [47].'}
    - {src: cicflowmeter-src-2018, locator: "BasicPacketInfo.java, field declaration", quote: 'private int TCPWindow=-1;'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, field declarations",
       quote: 'private int Init_Win_bytes_forward=-1; private int Init_Win_bytes_backward=-1;'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setTCPWindow(tcp.window());'}

# Cot 'PSH Flag Cnt' chua co SYN cua goi dau (build/flag_order.py, XN-FLAG-ORDER); validate.py kiem lai dieu nay.
- pid: H3-WINSCALE
  when: {all: [["Protocol", "==", 6], ["PSH Flag Cnt", "==", 0]]}
  text: "The first packet of this TCP flow is not a SYN segment, so the initial-window columns hold window fields of segments sent after the connection was opened. Such a field is not in bytes when window scaling is in use: the scale factor is agreed only in the SYN segments and every later window field is shifted by it, so the real window can be larger than the recorded value. Only a window field carried in a SYN or SYN-ACK segment is never scaled."
  support:
    - {src: rfc7323, locator: "Section 2.1",
       quote: 'This option is sent only in a <SYN> segment (a segment with the SYN bit on), hence the window scale is fixed in each direction when a connection is opened.'}
    - {src: rfc7323, locator: "Section 2.2",
       quote: 'The window field in a segment where the SYN bit is set (i.e., a <SYN> or <SYN,ACK>) MUST NOT be scaled.'}
    - {src: rfc9293, locator: "Section 3.1, Header Format", quote: 'The value is shifted when the window scaling extension is used [47].'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setTCPWindow(tcp.window());'}
    - {src: cicflowmeter-src-2018, locator: "BasicFlow.java, CSV row writer",
       quote: 'for(String key: flagCounts.keySet()){ dump.append(flagCounts.get(key).value).append(separator); //50,51,52,53,54,55,56,57'}

- pid: H3-TIMEOUT
  when: {all: [["Flow Duration", ">=", 119000000]]}
  text: "The flow lasted until the extractor's default 120 s flow timeout. A longer connection is split into several consecutive flows, so this duration does not cover the whole session."
  support:
    - {src: cicflowmeter-src-2018, locator: "ReadPcapFileWorker.java, constructor", quote: 'flowTimeout = 120000000L;'}
    - {src: cicflowmeter-src-2018, locator: "TrafficFlowWorker.java, doInBackground()",
       quote: 'FlowGenerator flowGen = new FlowGenerator(true,120000000L, 5000000L);'}
    - {src: cicflowmeter-src-2018, locator: "FlowGenerator.java, addPacket()",
       quote: '// Flow finished due flowtimeout: // 1.- we move the flow to finished flow list // 2.- we eliminate the flow from the current flow list // 3.- we create a new flow with the packet-in-process'}
    - {src: distrinet-2018, locator: "CSECICIDS2018.html, DoS Slowloris",
       quote: 'With the timeout value of the CICFlowMeter being set to 120 seconds when processing this dataset, a single DoS Slowloris TCP connection will be split over multiple flows.'}

- pid: H3-UDP
  when: {all: [["Protocol", "==", 17]]}
  text: "This is a UDP flow. The extractor reads flags and the window only from TCP headers, so for UDP the flag columns stay 0 and the initial-window columns stay -1; they carry no information about this flow."
  support:
    - {src: cicflowmeter-readme, locator: "ReadMe.txt, list of extracted features",
       quote: 'Fwd PSH flags Number of times the PSH flag was set in packets travelling in the forward direction (0 for UDP)'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setFlagRST(tcp.flags_RST());'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setTCPWindow(tcp.window());'}
    - {src: cicflowmeter-src-2018, locator: "BasicPacketInfo.java, field declaration", quote: 'private int TCPWindow=-1;'}

- pid: H3-NOTRANSPORT
  when: {all: [["Protocol", "==", 0]]}
  text: "Protocol 0 here means the packets carried neither a TCP nor a UDP header: the extractor sets the protocol only to 6 (TCP) or 17 (UDP) and otherwise keeps the Java default value 0. It does not refer to IANA protocol number 0 (HOPOPT)."
  support:
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, TCP branch", quote: 'packetInfo.setProtocol(6);'}
    - {src: cicflowmeter-src-2018, locator: "PacketReader.java, UDP branch", quote: 'packetInfo.setProtocol(17);'}
    - {src: cicflowmeter-src-2018, locator: "BasicPacketInfo.java, field declarations", quote: 'private int protocol;'}
    - {src: java8-jls, locator: "Section 4.12.5, Initial Values of Variables", quote: 'For type int, the default value is zero, that is, 0.'}
    - {src: iana-protocols, locator: "protocol-numbers-1.csv, row 0", quote: '0,HOPOPT,IPv6 Hop-by-Hop Option'}

#   - moi ID trong `entries` phai xuat hien trong `row.quote` (validate.py kiem);
#   - `label` la ten nhan trong CSV cua dataset (cot Label_Text); `paper_name` la ten trong paper.
# Technique ma KB dung cho mot entry = sub_technique neu co, nguoc lai technique.

